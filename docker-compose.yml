services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-frontend
    container_name: template-frontend-dev
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    env_file:
      - path: ./frontend/.env
        required: false
    volumes:
      - ./frontend/src:/workspace/frontend/src
      - ./frontend/public:/workspace/frontend/public
      - ./frontend/index.html:/workspace/frontend/index.html
      - ./frontend/vite.config.ts:/workspace/frontend/vite.config.ts
      - ./altaforge-ui/src:/workspace/altaforge-ui/src
      - ./altaforge-ui/dist:/workspace/altaforge-ui/dist
    networks:
      - template-network
    restart: unless-stopped

  storybook:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-storybook
    container_name: template-storybook-dev
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./altaforge-ui/src:/workspace/altaforge-ui/src
    networks:
      - template-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: template-backend-dev
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    networks:
      - template-network
    restart: unless-stopped

networks:
  template-network:
    driver: bridge
